<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copilot 8</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <script src="gama-fields.js" defer></script>
    <script src="excel.js?v=3" defer></script>
    <script src="app.js?v=3" defer></script>
</head>
<body>
<main>
    <header class="top">
        <h1><bdi>Copilot 8</bdi></h1>

        <button id="open-connection" type="button" data-connected="false"
                aria-haspopup="dialog" aria-controls="connection-dialog">
            מנותק
        </button>
    </header>

    <nav class="actions" aria-label="פעולות">
        <button id="new-message" class="primary" type="button" disabled>
            הודעה חדשה
        </button>
        <button id="open-dictionary" type="button">מילון לייבלים</button>
    </nav>

    <p id="notice" class="notice" role="status"></p>

    <section class="card" aria-labelledby="active-title">
        <h2 id="active-title">שידורים פעילים</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Label</th><th>Data מקודד</th><th>תדר</th><th>פעולות</th></tr>
                </thead>
                <tbody id="active">
                    <tr><td colspan="4">אין שידורים מחזוריים פעילים.</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="card" aria-labelledby="traffic-title">
        <div class="section-head">
            <h2 id="traffic-title">תעבורת UART</h2>

            <div class="actions">
                <label class="inline">כיוון
                    <select id="direction">
                        <option value="">הכול</option>
                        <option>TX</option>
                        <option>RX</option>
                        <option>ERROR</option>
                    </select>
                </label>

                <button id="record" type="button">התחל הקלטה</button>
                <button id="export" type="button" disabled>הורד Excel</button>

                <label class="inline">
                    <input id="follow" type="checkbox" checked>
                    עקוב אחרי תעבורה חדשה
                </label>
            </div>
        </div>

        <div class="table-wrap traffic">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>זמן מקומי</th><th>כיוון</th>
                        <th>Label</th><th>בתים בהקס</th>
                    </tr>
                </thead>
                <tbody id="traffic"></tbody>
            </table>
        </div>

        <output id="selected-event" class="details">
            בחר שורה כדי לראות את הפרטים שלה.
        </output>
    </section>
</main>

<dialog id="editor-dialog" aria-labelledby="editor-title">
    <form id="editor">
        <h2 id="editor-title">הודעה חדשה</h2>

        <label>Label לפי GAMA 11
            <select id="label" required>
                <option value="">בחר Label</option>
            </select>
        </label>

        <p id="description"></p>

        <div hidden>
            <label>Data<input id="data"></label>
            <label>סליידר<input id="slider" type="range"></label>
        </div>

        <div id="gama-fields"></div>

        <div class="grid">
            <label>SDI
                <select id="sdi">
                    <option value="0">00</option><option value="1">01</option>
                    <option value="2">10</option><option value="3">11</option>
                </select>
            </label>

            <label>SSM
                <select id="ssm">
                    <option value="0">00</option><option value="1">01</option>
                    <option value="2">10</option><option value="3">11</option>
                </select>
            </label>

            <label>סוג שידור
                <select id="mode">
                    <option value="once">בודד</option>
                    <option value="cycle">מחזורי</option>
                </select>
            </label>

            <label id="frequency-field" hidden>תדר בהרץ
                <input id="hz" type="number" min="0.1" max="100"
                       step="any" value="1" required disabled>
            </label>
        </div>

        <p id="editor-error" class="notice" role="status"></p>

        <div class="actions">
            <button id="submit-message" type="submit" class="primary">שלח</button>
            <button type="button" data-close>סגור</button>
        </div>
    </form>
</dialog>

<dialog id="connection-dialog" aria-labelledby="connection-title">
    <form id="connection-form">
        <h2 id="connection-title">חיבור UART</h2>

        <div class="grid">
            <label>פורט<select id="port" name="port" required></select></label>

            <label>Baud rate
                <input name="baudRate" type="number" min="1" step="1" required>
            </label>

            <label>Parity
                <select name="parity" required>
                    <option value="">בחר לפי המפרט</option>
                    <option>None</option><option>Even</option><option>Odd</option>
                </select>
            </label>

            <label>ביטי עצירה
                <select name="stopBits" required>
                    <option value="">בחר לפי המפרט</option>
                    <option>1</option><option>2</option>
                </select>
            </label>
        </div>

        <p id="connection-error" class="notice" role="status"></p>

        <div class="actions">
            <button id="connect" class="primary" type="submit">התחבר</button>
            <button id="disconnect" type="button" disabled>התנתק</button>
            <button id="refresh-ports" type="button">רענן פורטים</button>
            <button type="button" data-close>סגור</button>
        </div>
    </form>
</dialog>

<dialog id="dictionary-dialog" aria-labelledby="dictionary-title">
    <h2 id="dictionary-title">מילון לייבלים</h2>
    <label>חיפוש
        <input id="search" type="search" placeholder="מספר, שם או מזהה ציוד">
    </label>
    <ul id="dictionary"></ul>
    <button type="button" data-close>סגור</button>
</dialog>
</body>
</html>
